# TSB Lab OpenVPN 服务端（OpenVPN 2.6，无 NAT 方案）
# 隧道网段 10.66.1.0/24 与靶场网段 10.66.0.0/24 分离；
# 回程由各题目容器的静态路由 10.66.1.0/24 via 10.66.0.10 保证。
port 1194
proto udp
dev tun
topology subnet
server 10.66.1.0 255.255.255.0
ca /etc/openvpn/pki/ca.crt
cert /etc/openvpn/pki/server.crt
key /etc/openvpn/pki/server.key
dh none
tls-server
cipher AES-256-GCM
data-ciphers AES-256-GCM
auth SHA256
keepalive 10 60
persist-key
persist-tun
verb 3
